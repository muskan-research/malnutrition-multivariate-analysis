name: Reproducibility check

on:
  push:
  pull_request:

jobs:
  synthetic-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main analysis
        run: python -m scripts.run_main_analysis data/example_synthetic.csv

      - name: Run trajectory analysis
        run: python -m scripts.run_trajectory_analysis data/example_synthetic.csv

      - name: Run structure analysis
        run: python -m scripts.run_structure_analysis data/example_synthetic.csv

      - name: Run reference probability analysis
        run: python -m scripts.run_reference_probability data/example_synthetic.csv

      - name: Run ordinal analysis
        run: python -m scripts.run_ordinal_analysis data/example_synthetic.csv

      - name: Run clinical midpoint sensitivity analysis
        run: python -m scripts.run_clinical_midpoint_sensitivity data/example_synthetic.csv

      - name: Run permutation analysis
        run: python -m scripts.run_permutation_tests data/example_synthetic.csv --n-permutations 100

      - name: Generate figures
        run: python -m scripts.make_figures data/example_synthetic.csv
